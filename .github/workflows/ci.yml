name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: sb_publishable_example
          APP_BASE_URL: http://localhost:3000/go-web-ide
          APP_ALLOWED_EMAILS: owner@example.com
          RUNNER_INTERNAL_URL: http://127.0.0.1:8081
          RUNNER_SHARED_SECRET: ci-only-placeholder

  runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.mod
      - run: go test ./...
      - run: go build ./...
